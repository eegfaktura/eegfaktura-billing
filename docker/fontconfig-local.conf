<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- sans-serif (the JDK's SansSerif, Jasper's default font) = Liberation Sans, metric-compatible with Helvetica,
     the font the PDF is written in. See Dockerfile. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
</fontconfig>
