spring.datasource.url=${JDBC_DATABASE_URL\:jdbc\:postgresql\://localhost\:5432/billing}?currentSchema=billingj
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.dbcp2.validation-query=SELECT 1
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
springdoc.pathsToMatch=/api/**
# API docs and Swagger UI off unless SPRINGDOC_ENABLED=true (default on only in the "dev" profile).
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
# Spring Boot 4 uses Jackson 3; keep the JSON format of Jackson 2 (property order, null for primitives, ...).
spring.jackson.use-jackson2-defaults=true
spring.flyway.default-schema=billingj
spring.servlet.multipart.max-file-size=256KB
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH\:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE\:false}
# Message-ID uses this address' domain (eegfaktura.at) instead of the pod hostname (deliverability).
spring.mail.properties.mail.from=${MAIL_NO_REPLY_TO\:no-reply@eegfaktura.at}

app.noreplyto=${MAIL_NO_REPLY_TO\:no-reply@eegfaktura.at}
app.jwtpublickeyfile=${JWT_PUBLICKEYFILE\:/billing/zertifikat-pub.pem}

server.port=${HOST_PORT\:8080}
spring.mvc.async.request-timeout=600000
spring.threads.virtual.enabled=true