spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
springdoc.pathsToMatch=/api/**
#spring.flyway.default-schema=billingj
# 512KB: images of the editable mail texts (together <= 500 KB, MailTemplateCatalog), also logo/footer uploads
spring.servlet.multipart.max-file-size=512KB
spring.mail.host=${MAIL_HOST\:foo.bar.at}
spring.mail.port=${MAIL_PORT\:25}
spring.mail.username=${MAIL_USER\:foobar}
spring.mail.password=${MAIL_PASSWORD\:AAAAAAAAAAAAAAAAAAAAAAAA}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH\:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE\:false}
app.noreplyto=${MAIL_NO_REPLY_TO\:no-reply@eegfaktura.at}
# Where the integration tests write the generated PDFs/XLSX for a look by hand; empty = not written
app.test.store-documents-path=${TEST_STORE_DOCUMENTS_PATH\:}
logging.level.org.flywaydb=debug
spring.threads.virtual.enabled=true
# readable test output; LogFormatTests checks the JSON format
LOG_FORMAT=text
