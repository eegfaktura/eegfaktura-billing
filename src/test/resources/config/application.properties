# Loaded by Spring Boot on top of src/main/resources/application.properties (config/ location): only what the
# tests change. Everything else - including spring.jpa.hibernate.ddl-auto=validate - is the file that ships.
# The datasource comes from the Testcontainers database of each test class (DynamicPropertySource); Flyway and
# JPA use its default schema instead of billingj.
spring.flyway.default-schema=public
spring.mail.host=${MAIL_HOST\:foo.bar.at}
spring.mail.port=${MAIL_PORT\:25}
spring.mail.username=${MAIL_USER\:foobar}
spring.mail.password=${MAIL_PASSWORD\:AAAAAAAAAAAAAAAAAAAAAAAA}
# public certificate only (the private key was thrown away); JwtTokenService needs a key at start.
# Tests that sign tokens use TestTokens.CERT_FILE instead.
app.jwtpublickeyfile=src/test/resources/jwt-test-cert.pem
# Where the integration tests write the generated PDFs/XLSX for a look by hand; empty = not written
app.test.store-documents-path=${TEST_STORE_DOCUMENTS_PATH\:}
logging.level.org.flywaydb=debug
# readable test output; LogFormatTests checks the JSON format
LOG_FORMAT=text
