# Dependabot-Konfiguration.
#
# BEWUSST NUR das docker-Oekosystem: Security-Updates fuer die Sprach-Oekosysteme
# (gomod/npm/maven/pip) laufen bereits ohne Konfigdatei. Fuer `docker` gibt es KEINE
# Security-Updates — Base-Image-Aktualisierungen kommen ausschliesslich ueber
# Version-Updates, und die brauchen genau diese Datei. Das war die Luecke, durch die
# CVE-2026-18963 (Keycloak, CVSS 9.1) drei Monate unbemerkt blieb.
#
# Die Sprach-Oekosysteme hier NICHT zu ergaenzen ist Absicht: das wuerde Version-Update-PRs
# in Serie erzeugen, waehrend ohnehin ein Rueckstau offener Dependabot-PRs besteht.
#
# Ergaenzend laeuft im Platform-Repo ein woechentlicher Trivy-Scan der Base-Images
# (weekly-base-image-scan.yml) — der meldet Schwachstellen, waehrend Dependabot nur
# meldet, dass eine neuere Version existiert.
#
# Richtlinie Altsystem (Entscheidung 23.10.2026): das Altsystem wird mittelfristig durch v3
# abgeloest. Daher:
#   - Major-Updates werden nicht vorgeschlagen (ignore semver-major); sie werden nur bei
#     Sicherheitsluecken von Hand nachgezogen (CRITICAL immer).
#   - Patch- und Minor-Updates kommen gesammelt in EINEM woechentlichen PR (groups).
#   - Neue Versionen werden erst nach 7 Tagen vorgeschlagen (cooldown).
# `ignore` wirkt laut GitHub-Doku auch auf Security-Updates des jeweiligen Oekosystems. Da diese
# Datei nur `docker` konfiguriert und Docker keine Security-Updates kennt, bleiben die
# Security-Updates fuer gomod/npm/maven/pip davon unberuehrt. `cooldown` gilt nur fuer
# Version-Updates.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Java bleibt auf 21 (LTS). Nicht-LTS-Versionen (22, 23, ...) sollen nicht vorgeschlagen werden.
      - dependency-name: "eclipse-temurin"
        versions: [">= 22"]
      # Build-Image mit wanderndem Tag (3-eclipse-temurin-21): zieht bei jedem Build ohnehin die
      # neueste Maven-3-/Temurin-21-Version. Dependabot wuerde nur das JDK im Tag-Suffix hochsetzen
      # (vgl. #57: 21 -> 27), deshalb ganz ausgenommen.
      - dependency-name: "maven"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
