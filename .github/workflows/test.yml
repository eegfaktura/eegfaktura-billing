# Full test suite, called by pr-checks.yml on every pull request: ./mvnw clean verify with every
# Testcontainers suite. GitHub-hosted ubuntu-latest has Docker, which Testcontainers needs for
# PostgreSQL. Actions pinned by commit SHA.

name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          cache: maven

      # The test configuration writes the generated documents to a developer's local path
      # (app.test.store-documents-path); on the runner they go to a directory of the run.
      - name: Build and test
        env:
          APP_TEST_STOREDOCUMENTSPATH: ${{ runner.temp }}/billing-documents
        run: |
          mkdir -p "$APP_TEST_STOREDOCUMENTSPATH"
          # clean: stale classes and reports of another run must not count
          ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-full  # the name the CI report collector looks for
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 30
